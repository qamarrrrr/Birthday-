<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Dr. Rafael!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 20px;
    }

    .card-container {
      background: rgba(20, 22, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 210, 255, 0.2);
      border-radius: 20px;
      padding: 30px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 1px;
      margin-bottom: 20px;
      color: #e0e6ed;
    }

    .highlight {
      color: #00d2ff;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
    }

    .photo-section {
      margin: 15px 0 25px 0;
      display: flex;
      justify-content: center;
    }

    #walle-photo {
      width: 240px;
      max-width: 80%;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(255, 180, 0, 0.4));
      transition: transform 0.3s ease;
    }

    #walle-photo:hover {
      transform: scale(1.05) rotate(2deg);
    }

    .cake-section {
      margin: 25px 0;
    }

    .candle {
      width: 24px;
      height: 70px;
      background: linear-gradient(to bottom, #ff9f43, #ee5253);
      margin: 0 auto 15px auto;
      border-radius: 6px;
      position: relative;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(238, 82, 83, 0.5);
    }

    .flame {
      width: 18px;
      height: 28px;
      background: #ff9f43;
      border-radius: 50% 50% 35% 35%;
      position: absolute;
      top: -24px;
      left: 3px;
      box-shadow: 0 0 15px #ff9f43, 0 0 30px #ff3838;
      animation: flicker 0.6s infinite alternate;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .flame.out {
      opacity: 0;
      transform: scale(0.1);
      pointer-events: none;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.1) rotate(2deg); }
    }

    #candle-status {
      font-size: 0.85rem;
      color: #a0aec0;
    }

    button {
      background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin: 10px 0;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
    }

    #gift-btn {
      background: linear-gradient(135deg, #ff9f43 0%, #ee5253 100%);
      box-shadow: 0 4px 15px rgba(238, 82, 83, 0.3);
    }

    #gift-btn:hover {
      box-shadow: 0 6px 20px rgba(238, 82, 83, 0.5);
    }

    .hidden {
      display: none !important;
    }

    #gift-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
    }

    .modal-content {
      background: #1a1c23;
      border: 1px solid #ff9f43;
      padding: 30px;
      border-radius: 15px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 0 25px rgba(255, 159, 67, 0.4);
      position: relative;
      text-align: center;
    }

    .modal-content h2 {
      color: #ff9f43;
      margin-bottom: 15px;
    }

    .modal-content p {
      color: #cbd5e0;
      line-height: 1.5;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      color: #a0aec0;
      cursor: pointer;
    }

    .close:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <h1 id="card-title">HAPPY BIRTHDAY<br><span class="highlight">DR. RAFAEL!!!</span></h1>
    
    <div class="photo-section">
      <img src="https://pngimg.com/d/wall_e_PNG12.png" alt="WALL-E" id="walle-photo" />
    </div>

    <div class="cake-section">
      <div id="candle" class="candle burning" onclick="blowOutCandle()">
        <div id="flame" class="flame"></div>
      </div>
      <p id="candle-status">Click the flame (or blow into mic) to extinguish!</p>
    </div>

    <div class="music-section">
      <button id="music-btn" onclick="toggleMusic()">🎵 Play Birthday Song</button>
      <div id="youtube-player" style="display: none;"></div> 
    </div>

    <div class="gift-section">
      <button id="gift-btn" onclick="openGift()">🎁 Open Birthday Surprise</button>
      <div id="gift-modal" class="hidden">
        <div class="modal-content">
          <span class="close" onclick="closeGift()">&times;</span>
          <h2>Surprise 🎉</h2>
        </div>
      </div>
    </div>
  </div>

  <script>
    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      triggerConfetti();
      initMicrophoneBlowDetection();
    });

    let isBlownOut = false;

    function blowOutCandle() {
      if (isBlownOut) return;
      isBlownOut = true;

      const flame = document.getElementById('flame');
      const candle = document.getElementById('candle');
      const status = document.getElementById('candle-status');

      if (flame) flame.classList.add('out');
      if (candle) candle.classList.remove('burning');
      if (status) {
        status.innerText = '✨ Make a wish, Dr. Rafael!';
        status.style.color = '#00d2ff';
      }

      triggerConfetti();
    }

    function initMicrophoneBlowDetection() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const analyser = audioContext.createAnalyser();
          const microphone = audioContext.createMediaStreamSource(stream);
          const javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

          analyser.smoothingTimeConstant = 0.8;
          analyser.fftSize = 1024;

          microphone.connect(analyser);
          analyser.connect(javascriptNode);
          javascriptNode.connect(audioContext.destination);

          javascriptNode.onaudioprocess = () => {
            const array = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(array);
            let values = 0;

            for (let i = 0; i < array.length; i++) {
              values += array[i];
            }

            const average = values / array.length;

            if (average > 45 && !isBlownOut) {
              blowOutCandle();
              stream.getTracks().forEach(track => track.stop());
            }
          };
        })
        .catch(err => {
          console.log('Mic access optional/denied:', err);
        });
    }

    let player;
    let isPlaying = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '0',
        width: '0',
        videoId: 'TBE6VOJl_1g',
        playerVars: {
          'autoplay': 0,
          'loop': 1,
          'playlist': 'TBE6VOJl_1g'
        }
      });
    }

    function toggleMusic() {
      const btn = document.getElementById('music-btn');
      
      if (!player || typeof player.getPlayerState !== 'function') {
        alert("Audio is loading, please give it a moment!");
        return;
      }

      if (isPlaying) {
        player.pauseVideo();
        btn.innerText = '🎵 Play Birthday Song';
        isPlaying = false;
      } else {
        player.playVideo();
        btn.innerText = '⏸️ Pause Song';
        isPlaying = true;
      }
    }

    function openGift() {
      const modal = document.getElementById('gift-modal');
      if (modal) {
        modal.classList.remove('hidden');
        triggerConfetti();
      }
    }

    function closeGift() {
      const modal = document.getElementById('gift-modal');
      if (modal) {
        modal.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
