<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Dr. Rafael!</title>
<style>
:root{--blue:#00f2fe;--muted:#ffffff;--bg:#000000;--text:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#000000;color:#ffffff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden}
.wrap{max-width:650px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center}
h1{font-size:2.2rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#ffffff;text-shadow:0 0 15px rgba(255,255,255,0.4);margin-bottom:5px}
h2{font-size:2.4rem;font-weight:900;color:#ffffff;margin-bottom:25px;text-shadow:0 0 20px rgba(255,255,255,0.6)}

/* WALL-E Static Image Hero */
.hero {
  width: 100%;
  max-width: 440px;
  margin: 0 auto 20px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.hero img {
  width: 100%;
  height: auto;
  border-radius: 16px;
  box-shadow: 0 15px 35px rgba(0,0,0,.9), 0 0 25px rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  transition: transform .3s ease;
}
.hero img:hover {
  transform: scale(1.03) rotate(-1deg);
}

.candle{position:relative;width:32px;height:95px;margin:25px auto 25px;cursor:pointer}
.flame{position:absolute;top:-28px;left:50%;transform:translateX(-50%);width:20px;height:32px;background:linear-gradient(to top,#ff6a00,#ffee00);border-radius:50% 50% 35% 35%;box-shadow:0 0 25px #ff6a00,0 0 40px #ffee00;animation:flicker .1s infinite alternate;transition:opacity .4s}
@keyframes flicker{0%{transform:translateX(-50%) scale(1) rotate(-1deg)}100%{transform:translateX(-50%) scale(1.08) rotate(1deg)}}
.flame.out{opacity:0;animation:none}
.wick{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:4px;height:10px;background:#4a4a4a;border-radius:2px}
.body{position:absolute;bottom:0;width:100%;height:82px;background:linear-gradient(to right,#ff7e5f,#feb47b);border-radius:8px 8px 5px 5px;box-shadow:inset -4px 0 6px rgba(0,0,0,.3)}
.msg{font-size:1.1rem;color:#ffffff;margin-bottom:30px;font-weight:500;text-shadow:0 0 10px rgba(255,255,255,0.3)}
.btns{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
.btn{padding:16px 30px;border:none;border-radius:50px;font-size:1.05rem;font-weight:700;cursor:pointer;color:#fff;transition:all .3s}
.btn:hover{transform:translateY(-3px)}
.b1{background:linear-gradient(90deg,#00c6ff,#0072ff);box-shadow:0 4px 20px rgba(0,114,255,.4)}
.b2{background:linear-gradient(90deg,#ff416c,#ff4b2b);box-shadow:0 4px 20px rgba(255,65,108,.4)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:1000;padding:20px}
.modal.on{opacity:1;pointer-events:auto}
.box{background:#111422;border:1px solid rgba(255,255,255,.2);border-radius:20px;width:100%;max-width:580px;padding:20px;position:relative}
.x{position:absolute;top:8px;right:15px;font-size:2rem;color:#fff;cursor:pointer;background:none;border:none}
.vid{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;margin-top:15px;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.alt{display:block;margin-top:12px;color:var(--blue);font-size:.95rem;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:2000}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <h1>Happy Birthday</h1>
  <h2>Dr. Rafael!!!</h2>
  
  <!-- WALL-E Static Image Hero -->
  <div class="hero">
    <img src="https://i.redd.it/u2w653p1f8u81.jpg" alt="WALL-E with Rubik's Cube">
  </div>

  <div class="candle" id="candle"><div class="flame" id="flame"></div><div class="wick"></div><div class="body"></div></div>
  <p class="msg" id="status">✨ Blow into your mic or tap the candle to make a wish!</p>
  <div class="btns">
    <button class="btn b1" id="music">🎵 Surprise! </button>
    <button class="btn b2" id="surprise">🎁 Double Surprise :) </button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <button class="x" id="close" aria-label="Close">&times;</button>
    <h3 style="color:#ffffff;text-align:center;font-size:1.4rem">🎉 Ta-da! 🎉</h3>
    <div class="vid"><iframe id="yt" title="Birthday surprise" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
    <a class="alt" id="ytlink" href="#" target="_blank" rel="noopener">Video not loading? Open it on YouTube ↗</a>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var out=false, playing=false, micStream=null;

  var VIDEO_ID='-h8pbFY3f54';   
  var AUDIO_ID='TBE6VOJl_1g';   

  var cv=$('fx'), cx=cv.getContext('2d'), bits=[], raf=null;
  function size(){cv.width=innerWidth;cv.height=innerHeight}
  size(); addEventListener('resize',size);
  function confetti(){
    var cols=['#00f2fe','#ff416c','#ffee00','#ff6a00','#7cff6b','#ffffff'];
    for(var i=0;i<140;i++){
      var a=-Math.PI/2+(Math.random()-.5)*1.4, s=8+Math.random()*10;
      bits.push({x:innerWidth/2,y:innerHeight*.6,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1});
    }
    if(!raf) raf=requestAnimationFrame(tick);
  }
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    bits=bits.filter(function(b){return b.life>0&&b.y<cv.height+20});
    bits.forEach(function(b){
      b.vy+=.35;b.vx*=.99;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;b.life-=.006;
      cx.save();cx.globalAlpha=Math.max(b.life,0);cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);cx.restore();
    });
    raf=bits.length?requestAnimationFrame(tick):null;
    if(!bits.length) cx.clearRect(0,0,cv.width,cv.height);
  }

  function stopMic(){ if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null} }
  function blowOut(){
    if(out) return; out=true; stopMic();
    $('flame').classList.add('out');
    $('status').textContent='🎉 Your wish has been sent to the upper administration (god) 🎉';
    $('status').style.color='#ffffff';
    confetti();
  }
  $('candle').addEventListener('click',blowOut);

  function initMic(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return;
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      micStream=stream;
      var mc=new (window.AudioContext||window.webkitAudioContext)();
      var an=mc.createAnalyser(); an.fftSize=512;
      mc.createMediaStreamSource(stream).connect(an);
      var buf=new Uint8Array(an.fftSize);
      (function check(){
        if(out||!micStream) return;
        an.getByteTimeDomainData(buf);
        var sum=0; for(var i=0;i<buf.length;i++){var v=(buf[i]-128)/128; sum+=v*v}
        if(Math.sqrt(sum/buf.length)>.25) blowOut(); else requestAnimationFrame(check);
      })();
    }).catch(function(){});
  }
  addEventListener('load',initMic);

  var music=$('music'), audioFrame=null;
  function ytCmd(func){
    if(audioFrame&&audioFrame.contentWindow)
      audioFrame.contentWindow.postMessage(JSON.stringify({event:'command',func:func,args:''}),'*');
  }
  function startSong(){
    stopMic();
    if(!audioFrame){
      audioFrame=document.createElement('iframe');
      audioFrame.title='Birthday music';
      audioFrame.setAttribute('allow','autoplay; encrypted-media');
      audioFrame.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
      audioFrame.style.cssText='position:fixed;left:0;bottom:0;width:2px;height:2px;border:0;opacity:0;pointer-events:none';
      audioFrame.src='https://www.youtube.com/embed/'+AUDIO_ID+'?autoplay=1&loop=1&playlist='+AUDIO_ID+'&enablejsapi=1&playsinline=1&controls=0&rel=0';
      document.body.appendChild(audioFrame);
    } else ytCmd('playVideo');
    playing=true; music.textContent='⏸️ Pause Music';
  }
  function stopSong(){
    if(playing) ytCmd('pauseVideo');
    playing=false; music.textContent='🎵 Surprise!';
  }
  music.addEventListener('click',function(){playing?stopSong():startSong()});

  var modal=$('modal'), yt=$('yt');
  $('ytlink').href='https://www.youtube.com/watch?v='+VIDEO_ID;
  $('surprise').addEventListener('click',function(){
    stopSong(); stopMic();
    yt.src='https://www.youtube.com/embed/'+VIDEO_ID+'?autoplay=1&rel=0&playsinline=1';
    modal.classList.add('on'); confetti();
  });
  function closeIt(){modal.classList.remove('on'); yt.src='about:blank'}
  $('close').addEventListener('click',closeIt);
  modal.addEventListener('click',function(e){if(e.target===modal) closeIt()});
})();
</script>
</body>
</html>
