<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Dr. Rafael!</title>
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --accent-blue: #00f2fe;
      --accent-coral: #ff6a00;
      --text-main: #ffffff;
      --text-muted: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0d17;
      background-image: radial-gradient(circle at center, #1a1c2e 0%, #0b0d17 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .card-wrapper {
      max-width: 650px;
      width: 100%;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    h2 {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--accent-blue);
      margin-bottom: 25px;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
    }

    .hero-section {
      width: 240px;
      height: 240px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .walle-hero {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.8));
      transition: transform 0.3s ease;
    }

    .walle-hero:hover {
      transform: scale(1.05) rotate(-2deg);
    }

    .candle-container {
      position: relative;
      width: 32px;
      height: 95px;
      margin: 10px auto 25px;
      cursor: pointer;
    }

    .flame {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 32px;
      background: linear-gradient(to top, #ff6a00, #ffee00);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 25px #ff6a00, 0 0 40px #ffee00;
      animation: flicker 0.1s infinite alternate;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-1deg); }
      100% { transform: translateX(-50%) scale(1.08) rotate(1deg); }
    }

    .flame.out {
      opacity: 0;
      transform: translateX(-50%) scale(0.1);
    }

    .wick {
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 10px;
      background: #4a4a4a;
      border-radius: 2px;
    }

    .candle-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 82px;
      background: linear-gradient(to right, #ff7e5f, #feb47b);
      border-radius: 8px 8px 5px 5px;
      box-shadow: inset -4px 0 6px rgba(0,0,0,0.3);
    }

    .instruction {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 30px;
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }
