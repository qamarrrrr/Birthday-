<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Dr. Rafael!</title>
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0d17 0%, #1a1c2e 50%, #0b0d17 100%);
      --card-bg: rgba(22, 27, 46, 0.85);
      --accent-blue: #00f2fe;
      --accent-coral: #ff6a00;
      --text-main: #ffffff;
      --text-muted: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 35px 25px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    h2 {
      font-size: 1.6rem;
      color: var(--accent-blue);
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .walle-container {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .walle-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
      transition: transform 0.3s ease;
    }

    .walle-container img:hover {
      transform: scale(1.05) rotate(-3deg);
    }

    /* Candle & Flame Section */
    .candle-container {
      position: relative;
      width: 30px;
      height: 90px;
      margin: 10px auto 25px;
      cursor: pointer;
    }

    .flame {
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 30px;
      background: linear-gradient(to top, #ff6a00, #ffee00);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 20px #ff6a00, 0 0 35px #ffee00;
      animation: flicker 0.1s infinite alternate;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-1deg); }
      100% { transform: translateX(-50%) scale(1.08) rotate(1deg); }
    }

    .flame.out {
      opacity: 0;
      transform: translateX(-50%) scale(0.2);
    }

    .wick {
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 10px;
      background: #4a4a4a;
      border-radius: 2px;
    }

    .candle-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 78px;
      background: linear-gradient(to right, #ff7e5f, #feb47b);
      border-radius: 6px 6px 4px 4px;
      box-shadow: inset -4px 0 6px rgba(0,0,0,0.2);
    }

    .instruction {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
      color: #fff;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
    }

    .btn-surprise {
      background: linear-gradient(90deg, #ff416c 0%, #ff4b2b 100%);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
    }

    .btn-surprise:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
    }

    /* Video Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #111422;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      width: 100%;
      max-width: 560px;
      padding: 20px;
      position: relative;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.8rem;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      margin-top: 15px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Happy Birthday</h1>
    <h2>Dr. Rafael!!!</h2>

    <div class="walle-container">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="WALL-E" id="walle-photo" style="display:none;" />
      <!-- High quality vector WALL-E image -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/WALL-E_icon.svg" alt="WALL-E" id="walle-svg-photo" />
    </div>

    <!-- Interactive Candle -->
    <div class="candle-container" id="candle">
      <div class="flame" id="flame"></div>
      <div class="wick"></div>
      <div class="candle-body"></div>
    </div>

    <p class="instruction" id="status-text">✨ Blow into your mic or tap the candle to make a wish!</p>

    <div class="btn-group">
      <button class="btn btn-primary" id="music-btn">
        🎵 Play Birthday Song
      </button>
      <button class="btn btn-surprise" id="surprise-btn">
        🎁 Open Birthday Surprise
      </button>
    </div>
  </div>

  <!-- Video Modal -->
  <div class="modal-overlay" id="video-modal">
    <div class="modal-content">
      <button class="close-btn" id="close-modal">&times;</button>
      <h3 style="color: var(--accent-blue); text-align: center;">🎉 Ta-da! 🎉</h3>
      <div class="video-container">
        <div id="youtube-player"></div>
      </div>
    </div>
  </div>
