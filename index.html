    :root {

      --accent-neon: #00f2fe;
      --accent-warm: #ff6a00;
      --text-glow: #ffffff;
      --card-bg: rgba(18, 22, 38, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #1a2035 0%, #0a0c14 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      overflow-x: hidden;
    }

    /* Full-Screen Card Experience */
    .card-wrapper {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 30px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 0 50px rgba(0, 242, 254, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.05);
      position: relative;
      animation: floatIn 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
    }

    h2 {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent-neon);
      text-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
      margin-bottom: 25px;
    }

    /* Hero WALL-E Display */
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0 25px;
      position: relative;
    }

    .walle-hero {
      width: 220px;
      height: 220px;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6)) drop-shadow(0 0 15px rgba(0,242,254,0.3));
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .walle-hero:hover {
      transform: scale(1.08) rotate(-2deg);
    }

    /* Candle & Flame Section */
    .candle-container {
      position: relative;
      width: 32px;
      height: 95px;
      margin: 15px auto 25px;
      cursor: pointer;
    }

    .flame {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 32px;
      background: linear-gradient(to top, #ff6a00, #ffee00);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 25px #ff6a00, 0 0 45px #ffee00;
      animation: flicker 0.12s infinite alternate;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
